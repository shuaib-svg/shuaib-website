<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHUAIB | JARVIS AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
background:#020914;color:#00d9ff;
font-family:Arial,sans-serif;
text-align:center;min-height:100vh;
overflow-x:hidden;
}
header{padding:25px;letter-spacing:5px;
text-shadow:0 0 15px #00d9ff}
.circle{
width:220px;height:220px;margin:35px auto;
border:3px solid #00d9ff;border-radius:50%;
box-shadow:0 0 20px #00d9ff, inset 0 0 25px #007bff;
display:flex;align-items:center;justify-content:center;
animation:glow 3s infinite alternate;
}
.avatar {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
  box-shadow: 0 0 15px #00d9ff, 0 0 35px #00d9ff;
  animation: glow 2s infinite alternate;
}
  @keyframes glow {
  from {
    box-shadow: 0 0 10px #00d9ff;
  }
  to {
    box-shadow: 0 0 30px #00d9ff, 0 0 50px #0088ff;
  }
  }
}
h1{font-size:32px;text-shadow:0 0 15px #00d9ff}
p{color:#a5eaff;margin:15px}
.card{
border:1px solid #008cff;border-radius:12px;
padding:20px;margin:15px auto;max-width:330px;
background:#06182b;box-shadow:0 0 12px #004c80;
}
button{
background:transparent;color:#00d9ff;
border:1px solid #00d9ff;padding:13px 25px;
border-radius:25px;margin:10px;cursor:pointer;
box-shadow:0 0 10px #00d9ff;
}
button:hover{background:#00d9ff;color:#001020}
@keyframes glow{
from{transform:rotate(0deg);box-shadow:0 0 10px #00d9ff}
to{transform:rotate(5deg);box-shadow:0 0 35px #00d9ff}
}
footer{padding:25px;color:#548ba8}
</style>
</head>
<body>
<header>◈ J.A.R.V.I.S ◈</header>
<img class="avatar" src="shuaib-avatar.jpg" alt="Shuaib AI Avatar">
<h1>HELLO, I'M SHUAIB</h1>
<p>WELCOME TO MY DIGITAL WORLD</p>
<div class="card">
<h2>SYSTEM STATUS</h2>
<p>● ALL SYSTEMS ONLINE</p>
<p>AI INTERFACE ACTIVE</p>
</div>
<div class="card">
<h2>ABOUT ME</h2>
<p>I'm Shuaib. Welcome to my futuristic world.</p>
</div>
<div class="card">
<h2>MY COMMAND CENTER</h2>
<button onclick="speak()">VOICE SYSTEM</button>
<button onclick="alert('JARVIS SYSTEM ONLINE')">SYSTEM CHECK</button>
</div>
  <div class="ai-chat">
  <h2>SHUAIB AI CHAT</h2>
    <div id="chatHistory"></div>
  <input type="text" id="userInput" placeholder="Ask me anything...">
    <button onclick="startListening()">🎙️ MIC</button>
  <button onclick="chat()">SEND</button>
    <button onclick="clearChat()">🗑️ CLEAR CHAT</button>
  <p id="reply">Hello! I am Shuaib AI.</p>
  </div>
  <div id="clock" style="text-align:center; color:#00d9ff; font-size:28px; font-weight:bold;">
</div>
<div id="date" style="text-align:center; color:white; font-size:16px;">
</div>
  
  <footer>POWERED BY SHUAIB © 2026</footer>
<script>
  function updateClock() {
  const now = new Date();

  document.getElementById("clock").innerText =
    now.toLocaleTimeString("en-IN");

  document.getElementById("date").innerText =
    now.toLocaleDateString("en-IN", {
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    });
}

updateClock();
setInterval(updateClock, 1000);
function jarvisGreeting() {
  let msg = new SpeechSynthesisUtterance(
    "Welcome back, SHUAIB. All systems are online."
  );
  msg.lang = "en-US";
  msg.rate = 0.9;
  msg.pitch = 0.85;
  speechSynthesis.speak(msg);
}
function speak(){
if('speechSynthesis' in window){
let msg=new SpeechSynthesisUtterance("Hello Shuaib. Jarvis system is online.");
speechSynthesis.speak(msg);
}else{alert("Voice not supported")}
}
  function startListening() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Microphone not supported");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "hi-IN";

  recognition.onresult = async function(event) {
    let transcript = event.results[0][0].transcript;

    if (transcript && typeof transcript.then === "function") {
      transcript = await transcript;
    }

    document.getElementById("userInput").value = String(transcript || "");

    if (transcript) {
      await chat();
    }
  };

  recognition.start();
  }
  function clearChat() {
  if (confirm("Are you sure you want to clear chat?")) {
    localStorage.removeItem("shuaibChatHistory");
    document.getElementById("chatHistory").innerHTML = "";
    document.getElementById("reply").innerText = "Hello! I am Shuaib AI.";
    document.getElementById("userInput").value = "";
  }
}

function showChatHistory() {
  let history = JSON.parse(localStorage.getItem("shuaibChatHistory") || "[]");
  let box = document.getElementById("chatHistory");

  box.innerHTML = history.map(msg =>
    `<p><b>${msg.role === "user" ? "You" : "SHUAIB AI"}:</b> ${msg.content}</p>`
  ).join("");
}
async function chat() {
  let question = document.getElementById("userInput").value.trim();
  let reply = document.getElementById("reply");

  if (question === "") {
    reply.innerText = "Please ask me something!";
    return;
  }

  reply.innerText = "SHUAIB AI is thinking...";
let chatHistory = JSON.parse(localStorage.getItem("shuaibChatHistory") || "[]");
chatHistory.push({ role: "user", content: question });
  try {
    const response = await fetch(
      "https://noisy-voice-88ee.alosha-alban.workers.dev",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
  message: question,
  messages: chatHistory
})
      }
    );

    const data = await response.json();
    if (data.reply) {
  chatHistory.push({ role: "assistant", content: data.reply });
  localStorage.setItem("shuaibChatHistory", JSON.stringify(chatHistory.slice(-20)));
      showChatHistory();
    }

    reply.innerText = data.reply || data.error || "No response received.";
    if (data.reply) {
  let spokenText = data.reply
  .replace(/\*\*/g, "")
  .replace(/SHUAIB/gi, "Shu-aib");
let msg = new SpeechSynthesisUtterance(spokenText);
      msg.lang = "hi-IN";
      msg.rate = 0.9;
msg.pitch = 0.85;
  speechSynthesis.speak(msg);
    }

  } catch (error) {
    reply.innerText = "Connection error. Please try again.";
  }
}
  showChatHistory();
  window.addEventListener("load", jarvisGreeting);
</script>
